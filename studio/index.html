<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
  <meta name="robots" content="noindex,nofollow">
  <title>Konfigurátor kamenárstvo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/studio.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
  <div id="loader" role="status"><img id="load-logo" src="./assets/moj-chatbot.svg" alt="Môj Chatbot"><progress max="4" value="0"></progress></div>
  <header><div class="brand"><span id="brand" data-t="title"></span></div><button id="review" class="primary" data-t="review"></button></header>
  <main class="layout">
    <section class="viewer" data-label="scene">
      <div id="viewport"></div><figure id="print" hidden><img id="rendered" data-label="frontImage" alt=""></figure>
      <div id="environments" role="group" data-label="prostredia"></div><p class="drag-hint" data-t="hint" aria-hidden="true"></p>
      <div id="part-picker" role="group" data-label="variant" hidden>
        <button id="variant-prev" type="button" data-label="previousVariant">‹</button>
        <div id="variant-swipe" aria-live="polite"><small id="variant-kind"></small><strong id="variant-value"></strong></div>
        <button id="variant-next" type="button" data-label="nextVariant">›</button>
        <button id="variant-close" type="button" data-label="close">×</button>
      </div>
      <div class="camera"><div class="tools" role="group" data-label="views">
        <button data-view="angle" data-t="angle"></button><button data-view="front" data-t="front"></button>
        <button data-view="detail" data-t="detail"></button><button data-view="side" data-t="side"></button>
      </div><div class="zoom"><button data-action="minus" data-label="minus">−</button><button data-action="plus" data-label="plus">+</button></div></div>
    </section>
    <aside>
      <button id="handle" aria-controls="sheet-content" data-label="sheet"><i></i></button>
      <div id="sheet-content">
        <nav id="step-track" data-label="editAreas"></nav>
        <progress id="step-progress" max="6" value="1" data-label="steps"></progress>
        <div class="scroll-panel" id="step-scroll">
          <h1 id="step-title" tabindex="-1"></h1><p id="step-hint"></p>
          <section data-step="0"><div id="product"></div></section>
          <section data-step="1" hidden><div class="subnav" id="shape-tools"><button data-shape-part="profile" data-t="profile"></button><button data-shape-part="cover" data-t="cover"></button></div><fieldset id="profile-field"><legend data-t="profile"></legend><div id="profile"></div></fieldset>
            <fieldset id="cover-field"><legend data-t="cover"></legend><div id="cover"></div></fieldset>
            <dl class="measure"><div><dt data-t="dims"></dt><dd id="size"></dd></div><div><dt data-t="edge"></dt><dd id="edge"></dd></div></dl></section>
          <section data-step="2" hidden><div id="samples" role="group" data-label="stone"></div><p class="stone-note" data-t="stoneFinish"></p></section>
          <section data-step="3" hidden><div class="subnav" id="letter-tools"></div><div id="letter-panel"><div id="letters" class="engrave-fields"></div></div></section>
          <section data-step="4" hidden><div id="extra-panel"><div id="extras"></div></div></section>
          <section data-step="5" id="result" hidden>
            <dl id="summary"></dl>
            <nav id="summary-pages" data-label="summaryTitle" hidden>
              <button type="button" id="summary-prev" data-t="back"></button>
              <span id="summary-page" aria-live="polite"></span>
              <button type="button" id="summary-next" data-t="nextPage"></button>
            </nav>
            <label class="link-label" for="design-link" data-t="designLink"></label>
            <input id="design-link" type="url" readonly><button type="button" id="copy" data-t="copyLink"></button>
            <dialog id="inquiry-dialog" aria-labelledby="inquiry-title"><button id="close-inquiry" data-t="close"></button><h2 id="inquiry-title" data-t="inquiry"></h2><p id="simulation" data-t="simulation" hidden></p>
            <form id="inquiry">
              <label><span data-t="contactName"></span><input required name="name" autocomplete="name" maxlength="120"></label>
              <label><span data-t="phone"></span><input required type="tel" name="phone" autocomplete="tel" maxlength="40"></label>
              <label><span data-t="email"></span><input required type="email" name="email" autocomplete="email" maxlength="254"></label>
              <label><span data-t="place"></span><input required name="place" maxlength="160"></label>
              <label><span data-t="note"></span><textarea name="note" rows="3" maxlength="2000"></textarea></label>
              <label class="consent"><input required type="checkbox" name="consent"><span data-t="consent"></span></label>
              <a id="policy" data-t="policy" hidden></a>
              <button type="submit" data-t="send"></button>
            </form><p id="confirmation" role="status"></p></dialog>
          </section>
        </div>
        <footer class="step-actions"><button id="back" data-t="back"></button><button id="next" class="primary" data-t="next"></button><button id="to-inquiry" class="primary" hidden data-t="toInquiry"></button></footer>
      </div>
    </aside>
  </main>
  <p id="error" role="alert" hidden></p><script type="module" src="./js/app.js"></script>
</body>
</html>
